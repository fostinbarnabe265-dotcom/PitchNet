name: build-mac
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Lower deployment target in CMakeLists (if hardcoded)
        run: |
          sed -i '' 's/\(CMAKE_OSX_DEPLOYMENT_TARGET[^0-9]*\)13\.0/\112.0/' CMakeLists.txt
          git diff --stat || true

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package
        run: |
          mkdir out
          find build -name "*.vst3" -exec cp -R {} out/ \;
          find build -name "*.component" -exec cp -R {} out/ \;
          ditto -c -k --keepParent out PitchNet-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PitchNet-mac
          path: PitchNet-mac.zip
